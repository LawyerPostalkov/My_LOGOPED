name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Logoped_App_Project
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Regenerate Android platform folder (fixes v1 embedding)
        run: |
          rm -rf android
          cd ..
          flutter create --platforms=android --project-name ai_logoped --org com.ailogoped ai_logoped_tmp
          cp -r ai_logoped_tmp/android Logoped_App_Project/android
          rm -rf ai_logoped_tmp
          cd Logoped_App_Project

      - name: Restore required permissions and app label
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          
          # Add required permissions if not present
          for PERM in RECORD_AUDIO INTERNET MODIFY_AUDIO_SETTINGS WRITE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE; do
            if ! grep -q "android.permission.$PERM" "$MANIFEST"; then
              sed -i "/<manifest/a\\    <uses-permission android:name=\"android.permission.$PERM\" />" "$MANIFEST"
            fi
          done
          
          # Set app label
          sed -i 's/android:label="[^"]*"/android:label="AI Логопед"/' "$MANIFEST"
          
          # Display result
          echo "Android Manifest updated:"
          cat "$MANIFEST"

      - name: Fix SDK constraint in pubspec.yaml
        run: |
          python3 - <<'PY'
          with open('pubspec.yaml', newline='') as f:
              lines = f.readlines()
          out = []
          in_env = False
          fixed = False
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('environment:'):
                  in_env = True
                  out.append(line)
                  continue
              if in_env and not fixed and stripped.startswith('sdk:'):
                  out.append("  sdk: '^3.5.0'\n")
                  fixed = True
                  in_env = False
                  continue
              out.append(line)
          with open('pubspec.yaml', 'w', newline='') as f:
              f.writelines(out)
          print('FIXED:', fixed)
          PY
          echo "---- pubspec.yaml content ----"
          cat pubspec.yaml
          echo "-------------------------------"

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Logoped-APK
          path: Logoped_App_Project/build/app/outputs/flutter-apk/app-release.apk
