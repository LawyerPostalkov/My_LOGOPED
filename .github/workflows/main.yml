name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Logoped_App_Project
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Regenerate Android platform folder (fixes v1 embedding)
        run: |
          rm -rf android
          cd ..
          flutter create --platforms=android --project-name ai_logoped --org com.ailogoped ai_logoped_tmp
          cp -r ai_logoped_tmp/android Logoped_App_Project/android
          rm -rf ai_logoped_tmp
          cd Logoped_App_Project

      - name: Restore required permissions and app label
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for PERM in RECORD_AUDIO INTERNET MODIFY_AUDIO_SETTINGS WRITE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE; do
            grep -q "\"android.permission.$PERM\"" "$MANIFEST" || \
            sed -i "s#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.$PERM\"/>#" "$MANIFEST"
          done
          sed -i 's/android:label="[^"]*"/android:label="AI Логопед"/' "$MANIFEST"
          cat "$MANIFEST"

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Logoped-APK
          path: Logoped_App_Project/build/app/outputs/flutter-apk/app-release.apk
